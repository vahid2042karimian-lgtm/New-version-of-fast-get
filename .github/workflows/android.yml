
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract FastGet
        run: |
          mkdir -p project
          unzip -q FastGet-complete.zip -d project
          echo "Extracted:"
          find project -maxdepth 4 -type f | head -80

      - name: Locate Gradle Wrapper
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            find project -type f \( -name "*.gradle*" -o -name "gradle-wrapper.properties" \)
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: List APK outputs
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastGet-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
